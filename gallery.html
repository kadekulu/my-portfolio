<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>実例ギャラリー | えりーとごみ</title>
<meta name="description" content="プロンプトから生成したイラストの実例集。各イラストに使用プロンプトを併記。">
<meta property="og:title" content="実例ギャラリー | えりーとごみ">
<meta property="og:description" content="プロンプトと生成イラストの実例集">
<meta property="og:type" content="website">
<meta property="og:image" content="https://kadekulu.github.io/my-portfolio/assets/airi_card.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101014; --surface:#18181d; --surface-2:#222229;
  --line:rgba(255,255,255,.1); --text:#f6f3ee; --muted:#b8b0a6; --soft:#77717a;
  --pink:#f18aa8; --mint:#73d0b2; --gold:#e4bf74; --blue:#7aa7e8;
}
*{box-sizing:border-box}
body{margin:0;color:var(--text);line-height:1.65;
  font-family:'Outfit','Inter','Zen Kaku Gothic New',sans-serif;
  background:linear-gradient(135deg,rgba(241,138,168,.12),transparent 34%),
             linear-gradient(230deg,rgba(115,208,178,.10),transparent 38%),var(--bg)}
a{color:inherit}
img{max-width:100%}
.site-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:10px clamp(14px,4vw,40px);background:rgba(16,16,20,.78);
  border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}
.brand{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:900;letter-spacing:.04em;text-decoration:none;font-size:.98rem}
.brand small{display:block;color:var(--muted);font-size:.66rem;font-weight:700;letter-spacing:.08em}
.header-nav{margin-left:auto;display:flex;gap:8px}
.header-nav a{min-height:36px;display:inline-flex;align-items:center;padding:0 14px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.045);font-size:.82rem;font-weight:700;text-decoration:none}
.header-nav a.current{border-color:rgba(241,138,168,.55);background:rgba(241,138,168,.14)}
main{width:min(1440px,100%);margin:0 auto;padding:18px clamp(12px,3vw,40px) 48px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:6px 0 14px}
.controls select{min-height:40px;padding:0 10px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);font:inherit;font-size:.86rem;font-weight:700;max-width:300px}
.count{color:var(--muted);font-size:.85rem;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:8px;background:rgba(24,24,29,.72);overflow:hidden;display:flex;flex-direction:column}
.card-img{aspect-ratio:2/3;background:#0b0b0e;cursor:pointer;overflow:hidden}
.card-img img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .45s ease}
.card-img:hover img{transform:scale(1.04)}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.card-theme{color:var(--gold);font-size:.7rem;font-weight:800;letter-spacing:.06em}
.card-caption{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:.95rem}
.card-char{color:var(--muted);font-size:.8rem}
.card details{border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.card summary{cursor:pointer;font-size:.8rem;font-weight:800;color:var(--gold);letter-spacing:.04em}
.prompt-text{margin-top:8px;background:#0b0b0e;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:.74rem;line-height:1.55;
  white-space:pre-wrap;word-break:break-word;color:#e8e2d9}
.copy-btn{margin-top:8px;min-height:34px;padding:0 16px;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.045);color:var(--text);font:inherit;font-size:.8rem;font-weight:700;cursor:pointer}
.empty{padding:56px 20px;text-align:center;color:var(--muted);border:1px solid var(--line);border-radius:8px;background:rgba(24,24,29,.5)}
.lightbox{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox.hidden{display:none}
.lb-overlay{position:absolute;inset:0;background:rgba(0,0,0,.88)}
.lb-content{position:relative;z-index:1;max-width:min(900px,100%);max-height:94vh;overflow:hidden;
  border:1px solid var(--line);border-radius:8px;background:#0b0b0e}
.lb-content img{max-width:100%;max-height:86vh;display:block;object-fit:contain}
.lb-info{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 16px}
.lb-info p{margin:0;color:var(--muted);font-size:.88rem}
.lb-close{min-height:36px;border-radius:999px;padding:0 14px;border:1px solid var(--line);
  color:var(--text);background:rgba(255,255,255,.08);font:inherit;font-weight:800;cursor:pointer}
footer{padding:22px;color:var(--soft);text-align:center;border-top:1px solid var(--line);font-size:.82rem}
@media (max-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">えりーとごみ<small>AI Illustration Portfolio</small></a>
  <nav class="header-nav" aria-label="ページ">
    <a href="prompts.html">プロンプト集</a>
    <a href="gallery.html" class="current">ギャラリー</a>
    <a href="index.html">トップ</a>
  </nav>
</header>
<main>
  <div class="controls">
    <select id="set-sel" aria-label="セットで絞り込み"><option value="">すべてのセット</option></select>
    <span class="count" id="count"></span>
  </div>
  <div id="grid"><div class="empty">読み込み中...</div></div>
</main>
<footer>&copy; 2026 えりーとごみ / AI Illustration Portfolio</footer>

<div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
  <div class="lb-overlay"></div>
  <div class="lb-content">
    <img id="lb-img" src="" alt="拡大表示">
    <div class="lb-info"><p id="lb-cap"></p><button id="lb-close" type="button">閉じる</button></div>
  </div>
</div>

<script>
const esc = s => (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const stripHead = p => (p || "")
  .replace(/^\(masterpiece[^)]*\)\s*,\s*\([^)]*illustration[^)]*\)\s*,?\s*/i, "")
  .replace(/^\s+/, "");
const thumb = path => "https://images.weserv.nl/?url=" + encodeURIComponent("kadekulu.github.io/my-portfolio/" + path) + "&w=520&output=webp";
let CUTS = {}, SETS = [], EXAMPLES = [];

document.getElementById("set-sel").addEventListener("change", render);

function render() {
  const sel = document.getElementById("set-sel").value;
  const grid = document.getElementById("grid");
  const items = EXAMPLES.filter(ex => !sel || ex.theme === sel);
  document.getElementById("count").textContent = items.length + " 件の実例";
  if (!items.length) {
    grid.innerHTML = '<div class="empty">実例イラストは準備中です。生成イラストが届き次第、ここにプロンプトとセットで掲載します。</div>';
    return;
  }
  grid.innerHTML = items.map(ex => {
    const cut = CUTS[ex.id] || {};
    const pub = stripHead(cut.prompt || "");
    const title = ex.title || cut.caption || "";
    return '<article class="card">' +
      '<div class="card-img" data-full="' + esc(ex.img) + '" data-cap="' + esc(title + " / " + (cut.charName || "")) + '">' +
      '<img loading="lazy" src="' + thumb(ex.img) + '" alt="' + esc(title || "実例イラスト") + '"></div>' +
      '<div class="card-body">' +
      '<span class="card-theme">' + esc(ex.theme || "") + "</span>" +
      (title ? '<span class="card-caption">' + esc(title) + "</span>" : "") +
      (cut.charName ? '<span class="card-char">' + esc(cut.charName) + " / カット " + esc(cut.cutId || "") + (cut.caption && cut.caption !== title ? " / " + esc(cut.caption) : "") + "</span>" : "") +
      "<details><summary>使用プロンプト</summary>" +
      '<div class="prompt-text">' + esc(pub) + "</div>" +
      '<button class="copy-btn" type="button" data-p="' + encodeURIComponent(pub) + '">コピー</button></details>' +
      "</div></article>";
  }).join("");
  grid.querySelectorAll(".card-img").forEach(el => el.onclick = () => {
    document.getElementById("lb-img").src = el.dataset.full;
    document.getElementById("lb-cap").textContent = el.dataset.cap;
    document.getElementById("lightbox").classList.remove("hidden");
    document.body.style.overflow = "hidden";
  });
  grid.querySelectorAll(".copy-btn").forEach(b => b.onclick = async () => {
    const text = decodeURIComponent(b.dataset.p);
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); ta.remove();
    }
    const old = b.textContent; b.textContent = "コピーしました"; setTimeout(() => b.textContent = old, 1400);
  });
}

const lb = document.getElementById("lightbox");
function closeLb() { lb.classList.add("hidden"); document.body.style.overflow = ""; document.getElementById("lb-img").src = ""; }
document.getElementById("lb-close").onclick = closeLb;
lb.querySelector(".lb-overlay").onclick = closeLb;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLb(); });

Promise.all([
  fetch("prompts-data.json").then(r => r.json()),
  fetch("examples.json").then(r => r.json()).catch(() => [])
]).then(([data, examples]) => {
  data.sets.forEach(set => {
    SETS.push(set.theme);
    set.characters.forEach(ch => ch.cuts.forEach(cut => {
      CUTS[cut.id] = { caption: cut.caption, prompt: cut.prompt, cutId: cut.cutId, charName: ch.name, theme: set.theme };
    }));
  });
  EXAMPLES = (examples || []).map(ex => ({ ...ex, theme: (CUTS[ex.id] || {}).theme || ex.theme || "" }));
  const sel = document.getElementById("set-sel");
  [...new Set(EXAMPLES.map(e => e.theme).filter(Boolean))].forEach(t => {
    const o = document.createElement("option"); o.value = t; o.textContent = t; sel.appendChild(o);
  });
  render();
}).catch(() => { document.getElementById("grid").innerHTML = '<div class="empty">データを読み込めませんでした</div>'; });
</script>
</body>
</html>
